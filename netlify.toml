[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/RENOrep.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/renofav.png"
  [headers.values]
    Content-Type = "image/png"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
